<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aye - Do Orum ao Aye | Links</title>
  <meta name="description" content="Aye - Tradicao ancestral encontra tecnologia moderna. Materializamos o sagrado com impressao 3D e acabamento artesanal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --terracota: #A65B42;
      --terracota-light: #c4795e;
      --terracota-glow: rgba(166, 91, 66, 0.4);
      --marrom: #41322A;
      --marrom-deep: #2e231d;
      --verde: #4b6043;
      --verde-light: #627a58;
      --creme: #F2E7DA;
      --creme-soft: #faf4ed;
      --creme-transparent: rgba(242, 231, 218, 0.08);
      --gold-accent: #d4a574;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--marrom-deep);
      color: var(--creme);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ========== BACKGROUND LAYERS ========== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg-gradient {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(166, 91, 66, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(75, 96, 67, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 50% 40% at 80% 70%, rgba(166, 91, 66, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, var(--marrom-deep) 0%, #352920 40%, var(--marrom) 100%);
    }

    .bg-noise {
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* Sacred geometry background pattern */
    .bg-sacred {
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='60' cy='60' r='40' fill='none' stroke='%23F2E7DA' stroke-width='0.5'/%3E%3Ccircle cx='60' cy='60' r='28' fill='none' stroke='%23F2E7DA' stroke-width='0.3'/%3E%3Ccircle cx='60' cy='60' r='16' fill='none' stroke='%23F2E7DA' stroke-width='0.3'/%3E%3Cline x1='60' y1='20' x2='60' y2='100' stroke='%23F2E7DA' stroke-width='0.2'/%3E%3Cline x1='20' y1='60' x2='100' y2='60' stroke='%23F2E7DA' stroke-width='0.2'/%3E%3Cline x1='31.7' y1='31.7' x2='88.3' y2='88.3' stroke='%23F2E7DA' stroke-width='0.2'/%3E%3Cline x1='88.3' y1='31.7' x2='31.7' y2='88.3' stroke='%23F2E7DA' stroke-width='0.2'/%3E%3C/svg%3E");
      background-size: 120px 120px;
      animation: sacredDrift 60s linear infinite;
    }

    @keyframes sacredDrift {
      from { transform: rotate(0deg) scale(1.1); }
      to { transform: rotate(360deg) scale(1.1); }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      animation: orbFloat 12s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(166, 91, 66, 0.12), transparent 70%);
      top: -100px;
      right: -80px;
      animation-duration: 14s;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(75, 96, 67, 0.1), transparent 70%);
      bottom: -60px;
      left: -60px;
      animation-duration: 18s;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(212, 165, 116, 0.08), transparent 70%);
      top: 40%;
      left: 60%;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(20px, -30px) scale(1.05); }
      50% { transform: translate(-15px, 15px) scale(0.95); }
      75% { transform: translate(25px, 20px) scale(1.02); }
    }

    /* ========== MAIN CONTAINER ========== */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 48px 24px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== PROFILE / AVATAR ========== */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 28px;
      opacity: 0;
      animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .avatar-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(
        from 0deg,
        var(--terracota),
        var(--gold-accent),
        var(--verde),
        var(--terracota-light),
        var(--terracota)
      );
      animation: ringRotate 8s linear infinite;
      position: relative;
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        transparent,
        rgba(166, 91, 66, 0.3),
        transparent,
        rgba(75, 96, 67, 0.2),
        transparent
      );
      animation: ringRotate 12s linear infinite reverse;
      filter: blur(8px);
    }

    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--marrom);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .avatar-inner svg {
      width: 60px;
      height: 60px;
    }

    /* ========== BRAND TEXT ========== */
    .brand {
      text-align: center;
      margin-bottom: 8px;
      opacity: 0;
      animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--creme);
      line-height: 1.1;
      position: relative;
      display: inline-block;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--terracota), transparent);
      animation: lineExpand 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }

    @keyframes lineExpand {
      to { width: 120%; }
    }

    .brand-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-weight: 400;
      font-style: italic;
      color: var(--gold-accent);
      letter-spacing: 0.15em;
      margin-top: 4px;
    }

    /* ========== TAGLINE ========== */
    .tagline {
      text-align: center;
      margin-bottom: 36px;
      opacity: 0;
      animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .tagline p {
      font-size: 0.82rem;
      font-weight: 300;
      color: rgba(242, 231, 218, 0.55);
      letter-spacing: 0.04em;
      line-height: 1.6;
      max-width: 300px;
    }

    /* ========== DIVIDER ========== */
    .divider {
      width: 100%;
      max-width: 280px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(166, 91, 66, 0.3), rgba(212, 165, 116, 0.2), rgba(75, 96, 67, 0.3), transparent);
      margin-bottom: 32px;
      opacity: 0;
      animation: revealFade 1s ease 0.6s forwards;
    }

    /* ========== LINKS ========== */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 40px;
    }

    .link-item {
      opacity: 0;
      transform: translateY(24px);
    }

    .link-item:nth-child(1) { animation: revealUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards; }
    .link-item:nth-child(2) { animation: revealUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards; }
    .link-item:nth-child(3) { animation: revealUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.0s forwards; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--creme);
      background: linear-gradient(135deg, rgba(242, 231, 218, 0.06) 0%, rgba(242, 231, 218, 0.02) 100%);
      border: 1px solid rgba(242, 231, 218, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--terracota), var(--verde));
      opacity: 0;
      transition: opacity 0.45s ease;
      z-index: 0;
    }

    .link-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: radial-gradient(circle, rgba(242, 231, 218, 0.1), transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
      z-index: 0;
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(166, 91, 66, 0.4);
      box-shadow:
        0 8px 32px rgba(166, 91, 66, 0.2),
        0 2px 8px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(242, 231, 218, 0.08);
    }

    .link-btn:hover::before {
      opacity: 0.12;
    }

    .link-btn:hover::after {
      width: 400px;
      height: 400px;
    }

    .link-btn:active {
      transform: translateY(-1px) scale(0.99);
      transition-duration: 0.1s;
    }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .link-btn:hover .link-icon svg {
      transform: scale(1.1);
    }

    .link-icon--site {
      background: linear-gradient(135deg, var(--terracota), var(--terracota-light));
      box-shadow: 0 4px 12px rgba(166, 91, 66, 0.3);
    }

    .link-icon--whatsapp {
      background: linear-gradient(135deg, var(--verde), var(--verde-light));
      box-shadow: 0 4px 12px rgba(75, 96, 67, 0.3);
    }

    .link-icon--instagram {
      background: linear-gradient(135deg, var(--terracota), #c2724f);
      box-shadow: 0 4px 12px rgba(166, 91, 66, 0.3);
    }

    .link-text {
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .link-title {
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .link-desc {
      font-size: 0.75rem;
      font-weight: 300;
      color: rgba(242, 231, 218, 0.45);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .link-arrow {
      margin-left: auto;
      position: relative;
      z-index: 1;
      opacity: 0.3;
      transition: all 0.4s ease;
    }

    .link-arrow svg {
      width: 16px;
      height: 16px;
    }

    .link-btn:hover .link-arrow {
      opacity: 0.8;
      transform: translateX(4px);
    }

    /* ========== FOOTER ========== */
    .footer {
      margin-top: auto;
      text-align: center;
      opacity: 0;
      animation: revealFade 1s ease 1.3s forwards;
    }

    .footer-divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.3), transparent);
      margin: 0 auto 16px;
    }

    .footer-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.75rem;
      font-style: italic;
      color: rgba(242, 231, 218, 0.25);
      letter-spacing: 0.1em;
    }

    .footer-values {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }

    .footer-value {
      font-size: 0.65rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(242, 231, 218, 0.2);
      position: relative;
    }

    .footer-value:not(:last-child)::after {
      content: '';
      position: absolute;
      right: -11px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(212, 165, 116, 0.3);
    }

    /* ========== ANIMATIONS ========== */
    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes revealFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ========== FLOATING PARTICLES ========== */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--gold-accent);
      border-radius: 50%;
      opacity: 0;
      animation: particleRise linear infinite;
    }

    .particle:nth-child(1) { left: 10%; animation-duration: 16s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 25%; animation-duration: 20s; animation-delay: -3s; width: 1.5px; height: 1.5px; }
    .particle:nth-child(3) { left: 40%; animation-duration: 18s; animation-delay: -7s; }
    .particle:nth-child(4) { left: 55%; animation-duration: 22s; animation-delay: -2s; width: 1px; height: 1px; }
    .particle:nth-child(5) { left: 70%; animation-duration: 17s; animation-delay: -5s; }
    .particle:nth-child(6) { left: 85%; animation-duration: 21s; animation-delay: -9s; width: 1.5px; height: 1.5px; }
    .particle:nth-child(7) { left: 15%; animation-duration: 19s; animation-delay: -12s; width: 1px; height: 1px; }
    .particle:nth-child(8) { left: 60%; animation-duration: 23s; animation-delay: -6s; }
    .particle:nth-child(9) { left: 35%; animation-duration: 15s; animation-delay: -10s; width: 1.5px; height: 1.5px; }
    .particle:nth-child(10) { left: 80%; animation-duration: 20s; animation-delay: -1s; width: 1px; height: 1px; }

    @keyframes particleRise {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.15;
      }
      50% {
        opacity: 0.08;
      }
      90% {
        opacity: 0.12;
      }
      100% {
        transform: translateY(-20vh) translateX(30px);
        opacity: 0;
      }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .container {
        padding: 40px 20px 32px;
      }

      .brand-name {
        font-size: 2.2rem;
      }

      .link-btn {
        padding: 14px 16px;
      }

      .link-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }
    }

    @media (min-width: 768px) {
      .link-btn:hover {
        transform: translateY(-4px) scale(1.025);
      }
    }

    /* ========== PREFERS REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
      .bg-sacred { animation: none; }
      .avatar-ring { animation: none; }
      .particle { animation: none; display: none; }
      .orb { animation: none; }
    }
  </style>
</head>
